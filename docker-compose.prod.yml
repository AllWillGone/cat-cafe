services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: yang
      MYSQL_DATABASE: cat_cafe
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/seed_demo_media.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: yang
      DB_NAME: cat_cafe
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  adminer:
    image: adminer:latest
    depends_on:
      - mysql
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
      - adminer
    volumes:
      - ./uploads/cats:/usr/share/nginx/html/cats
      - ./uploads/products:/usr/share/nginx/html/products
      - ./uploads/avatars:/usr/share/nginx/html/avatars
    restart: unless-stopped

volumes:
  mysql_data:
